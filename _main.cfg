#textdomain wesnoth-Uncle_Sam

[textdomain]
	name="wesnoth-Uncle_Sam"
	path="data/add-ons/Uncle_Sam/translations/"
[/textdomain]

#ifdef MULTIPLAYER
[binary_path]
	path=data/add-ons/Uncle_Sam
[/binary_path]

[modification]
	id="uncle_sam"
	name= _ "Uncle Sam"
	description= _ "All players receive the same income at regular intervals. All other income is removed.

Inspired by the Earth 2150 gamemode of the same name."
	{./wml/options.cfg}
	[event]
		name="preload"
		first_time_only="no"
		[lua]
			code = {./lua/uncle_sam.lua}
		[/lua]
	[/event]
[/modification]
#endif