#textdomain wesnoth-Uncle_Sam

[options]
	[slider]
		id="us_startingcash"
		name= _ "Starting Money"
		description= _ "Starting gold for each player"
		min=50
		max=1000
		default=200
		step=50
	[/slider]

	[slider]
		id="us_cashrate"
		name= _ "Cash Rate"
		description= _ "Gold rate per cycle"
		min=25
		max=200
		default=50
		step=25
	[/slider]

	[choice]
		id="us_rates"
		name= _ "Rate Frequency"
		description= _ "When are the rates to be payed"
		default=1
		[item]
			name= _ "Twice per day"
			value=0.5
		[/item]
		[item]
			name= _ "Daily"
			value=1
		[/item]
		[item]
			name= _ "Every two days"
			value=2
		[/item]
		[item]
			name= _ "Every three days"
			value=3
		[/item]
	[/choice]

	[choice]
		id="us_messages"
		name= _ "Ingame Messages"
		description= _ "What type of messages are to be displayed"
		default=0
		[item]
			name= _ "None"
			value=0
		[/item]
		[item]
			name= _ "Log"
			value=1
		[/item]
		[item]
			name= _ "Dialog"
			value=2
		[/item]
	[/choice]
[/options]