#textdomain wesnoth-Uncle_Sam

[options]
	[slider]
		id="us_startingcash"
		name= _ "Starting Cash"
		description= _ "Starting gold for each player"
		min=50
		max=1000
		default=200
		step=50
	[/slider]

	[slider]
		id="us_cashrate"
		name= _ "Cash Rate"
		description= _ "Gold rate per cycle"
		min=25
		max=200
		default=50
		step=25
	[/slider]

	[choice]
		id="us_rates"
		name= _ "Rate Cycle"
		description= _ "When are the rates to be payed"
		default=1
		[item]
			name="Twice per day"
			value=0.5
		[/item]
		[item]
			name="Daily"
			value=1
		[/item]
		[item]
			name="Every two days"
			value=2
		[/item]
	[/choice]
[/options]